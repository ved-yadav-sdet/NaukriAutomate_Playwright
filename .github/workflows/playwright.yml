name: Naukri Profile Update
on:
  schedule:
    - cron: '45 3 * * *'  # 09:15 IST
    - cron: '30 8 * * *'  # 14:00 IST
    - cron: '15 11 * * *' # 16:45 IST
  workflow_dispatch:
jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NAUKRI_USERNAME: 'vedpra9793@gmail.com'
      NAUKRI_PASSWORD: 'ved@12345'
      NAUKRI_PROFILE_NAME: 'Ved Prakash Yadav'
      NAUKRI_HEADLINE: 'Immediate Joiner | SDET | 5+ Years | Java | Selenium | Playwright | API Automation | Rest Assured | Appium | CI/CD | Jenkins'
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      TELEGRAM_BOT_TOKEN: '9059531703:AAFXEKpw2hP0z_Y4yvZhz_qmxCNlNFPIJrQ'
      TELEGRAM_CHAT_ID: '6477155798'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - run: npm ci
    - run: npx playwright install --with-deps chrome
    - name: Update profile
      run: xvfb-run npm run update-profile
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
