name: Naukri Profile Update
on:
  schedule:
    - cron: '15 3 * * *'  # 08:45 IST: resume re-upload
    - cron: '30 3 * * *'  # 09:00 IST: headline
    - cron: '15 8 * * *'  # 13:45 IST
    - cron: '0 11 * * *'  # 16:45 IST
  workflow_dispatch:
    inputs:
      job:
        description: 'What to run'
        type: choice
        options: [all, headline, resume]
        default: all
jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
      NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - run: npm ci
    - run: npx playwright install --with-deps chrome
    - name: Restore saved Naukri session
      env:
        NAUKRI_AUTH: ${{ secrets.NAUKRI_AUTH }}
      run: |
        if [ -n "$NAUKRI_AUTH" ]; then echo "$NAUKRI_AUTH" | base64 -d > auth.json; fi
    - name: Pick job
      id: pick
      run: |
        if [ "${{ github.event.schedule }}" = "15 3 * * *" ]; then echo "script=upload-resume" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          case "${{ inputs.job }}" in
            resume) echo "script=upload-resume" >> "$GITHUB_OUTPUT" ;;
            headline) echo "script=update-profile" >> "$GITHUB_OUTPUT" ;;
            *) echo "script=update-all" >> "$GITHUB_OUTPUT" ;;
          esac
        else echo "script=update-profile" >> "$GITHUB_OUTPUT"; fi
    - name: Run ${{ steps.pick.outputs.script }}
      run: xvfb-run npm run ${{ steps.pick.outputs.script }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
          !test-results/**/resume/**
        retention-days: 7
