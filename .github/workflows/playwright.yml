name: Naukri Profile Update
on:
  schedule:
    - cron: '45 3 * * *'  # 09:15 IST
    - cron: '30 8 * * *'  # 14:00 IST
    - cron: '15 11 * * *' # 16:45 IST
  workflow_dispatch:
jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
      NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - run: npm ci
    - run: npx playwright install --with-deps chrome
    - name: Restore saved Naukri session
      env:
        NAUKRI_AUTH: ${{ secrets.NAUKRI_AUTH }}
      run: |
        if [ -n "$NAUKRI_AUTH" ]; then echo "$NAUKRI_AUTH" | base64 -d > auth.json; fi
    - name: Update profile
      run: xvfb-run npm run update-profile
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
